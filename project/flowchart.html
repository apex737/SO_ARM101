<style>

:root[data-theme="dark"]{--bg:#262624;--card:#30302e;--line:#45443f;--text:#ece9e1;--muted:#a6a398;--accent:#d97757;--accent-soft:#41312a;--node:#3a312c;--node-line:#7a5545;--code:#2a2a28;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
header,main,footer{max-width:880px;margin:0 auto;padding:0 24px}
header{padding-top:28px}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;width:fit-content;max-width:100%}

nav a:hover{color:var(--text);background:var(--code)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.eyebrow{margin:28px 0 0;color:var(--accent);font-size:13px;letter-spacing:.06em}
h1{font:500 36px/1.25 var(--serif);margin:4px 0 6px;letter-spacing:-.01em}
h2{font:500 22px/1.35 var(--serif);margin:36px 0 8px}
.muted{color:var(--muted);margin:0}
#meta{font-size:15px}

input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#count{font-size:13px;margin:8px 2px 0}
article,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:14px 0}

details[open] summary::before{transform:rotate(90deg)}

dt{color:var(--muted)}
dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--code);padding:10px 12px;border-radius:8px}
.empty-state{padding:28px 22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;margin:14px 0}
#graph{overflow:auto;padding:12px}
svg{width:100%;min-width:540px;display:block}

svg .edge{fill:none;stroke:var(--accent);stroke-width:1.6}
svg .head{fill:var(--accent)}
svg .lbl{fill:var(--muted);font:12px var(--sans)}
footer{padding-top:24px;padding-bottom:40px;color:var(--muted);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.chip{font:500 13px/1 var(--sans);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip .num{font-variant-numeric:tabular-nums;color:var(--muted)}

<script>
const d=JSON.parse(document.getElementById('pbl-data').textContent);
const labels={id:'ID',name:'이름',value:'값·정책',unit:'단위',role:'역할',basis:'선택 근거',up:'키우거나 강화하면',down:'줄이거나 완화하면',pairs:'함께 바꿀 항목',code:'관련 코드',step:'관련 Step',decision:'관련 결정',state:'현재 상태',why:'왜 알아야 하나',ability:'확인할 수행',evidence:'확인 근거',history:'변경·평가 이력',does:'하는 일',runs:'실행 주체',when:'실행 시점·주기',shared:'공유 상태·보호 방법',functions:'관련 함수',params:'관련 설정',from:'출발',to:'도착',data:'전달 내용',form:'형식·단위',rate:'주기·조건',via:'전달 수단',title:'제목',steps:'시간순 이동',condition:'조건',status:'상태',result:'결과',source:'근거 종류',answer:'사용자 답',rubric:'평가 기준',prompt:'문항',date:'날짜',hints:'힌트 사용',level:'이해 수준',goal:'학습 목표',learner:'학습자 메모'};
const tone={'확인됨':'ok','이해 공백':'gap','재확인':'warn','재검증 필요':'warn'};
const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x;};
document.getElementById('meta').textContent=(d.project||'프로젝트 미설정')+' · 갱신 '+(d.updated||'아직 없음');
if(d.example)document.getElementById('callout').append(el('p','설명용 예시입니다. 실제 시험·학습 통과 증거가 아닙니다.','callout'));
function value(v,dd){
 if(Array.isArray(v)&&v.length&&v.every(x=>typeof x!=='object')){const ul=el('ul');v.forEach(x=>ul.append(el('li',String(x))));dd.append(ul);}
 else if(Array.isArray(v)?v.length:v&&typeof v==='object'){dd.append(el('pre',JSON.stringify(v,null,2)));}
 else if(v===''||v===undefined||v===null||Array.isArray(v)){dd.textContent='미기록';dd.className='empty';}
 else dd.textContent=String(v);
}
function fields(obj,target){const dl=el('dl');for(const [k,v] of Object.entries(obj)){if(['id','name','title','state','level'].includes(k))continue;dl.append(el('dt',labels[k]||k));const dd=el('dd');value(v,dd);dl.append(dd);}target.append(dl);}
function heading(x,text){const h=el('h3');h.append(el('span',x.id,'id'),el('span',text));if(x.state)h.append(el('span',x.state+(x.level?' · '+x.level:''),'badge '+(tone[x.state]||'')));return h;}
const all=d.items||d.blocks||[];let query='',only='';
if(d.kind==='concepts'){const box=document.getElementById('learner');box.className='panel learner';box.append(el('h2','학습자 메모'));const t=(d.learner||'').trim();box.append(el('p',t||'아직 없습니다. 대화에서 익숙한 것과 처음인 것이 드러나면 AI가 한 줄로 적습니다.',t?'':'empty'));}
function filters(){const box=document.getElementById('filters');box.replaceChildren();const order=d.kind==='concepts'?['미확인','이해 공백','확인됨','재확인','범위 제외']:[];const seen=[...order];for(const x of all)if(x.state&&!seen.includes(x.state))seen.push(x.state);if(!seen.length)return;
 const chip=(label,val,n)=>{const b=el('button',undefined,'chip'+(n?'':' zero'));b.type='button';b.setAttribute('aria-pressed',String(only===val));b.append(el('span',label),el('span',String(n),'num'));b.addEventListener('click',()=>{only=only===val||val===''?'':val;filters();render();});box.append(b);};
 chip('전체','',all.length);for(const s of seen)chip(s,s,all.filter(x=>x.state===s).length);}

 const host=document.getElementById('graph');const ns='http://www.w3.org/2000/svg';const s=(tag,attrs,text)=>{let x=document.createElementNS(ns,tag);for(let[k,v]of Object.entries(attrs))x.setAttribute(k,v);if(text!==undefined)x.textContent=text;return x;};
 if(d.blocks.length){const svg=s('svg',{viewBox:'0 0 800 '+((d.blocks.length-1)*150+100),role:'img','aria-label':'실제 동작 블록과 데이터 흐름'});const defs=s('defs',{}),m=s('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});m.append(s('path',{d:'M 0 0 L 10 5 L 0 10 z',class:'head'}));defs.append(m);svg.append(defs);
 d.blocks.forEach((b,i)=>{const y=i*150+15;svg.append(s('rect',{x:190,y,width:420,height:70,rx:12,class:'node'}));svg.append(s('text',{x:212,y:y+29,class:'t1'},b.id+' · '+b.name));svg.append(s('text',{x:212,y:y+52,class:'t2'},b.runs||b.does));});
 d.links.forEach((l,i)=>{const a=d.blocks.findIndex(b=>b.id===l.from),b=d.blocks.findIndex(b=>b.id===l.to);if(a<0||b<0)return;let path;if(b===a+1)path='M 400 '+(a*150+85)+' L 400 '+(b*150+15);else{let x=650+(i%4)*30;path='M 610 '+(a*150+50)+' H '+x+' V '+(b*150+50)+' H 610';}svg.append(s('path',{d:path,class:'edge','marker-end':'url(#arrow)'}));const tip=l.id+(l.data?' · '+l.data:'');let lb;if(b===a+1)lb=s('text',{x:412,y:a*150+125,class:'lbl'},tip);else{let x=650+(i%4)*30;lb=s('text',{x:x+5,y:(Math.min(a,b)*150+Math.max(a,b)*150)/2+54,class:'lbl'},l.id);}lb.append(s('title',{},tip));svg.append(lb);});host.append(svg);}
